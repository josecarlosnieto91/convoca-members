# Gate de cobertura (skill flujo-desarrollo, puerta P4).
# Modo bootstrap: sin .coverage-floor, sólo informa del número y pasa.
# Con .coverage-floor (porcentaje), falla si la cobertura baja del suelo.
#
# OJO (medido el 21-10-2026): este job no podía funcionar tal como estaba. El bootstrap unitario de
# members carga el de convoca-core y, si no lo encuentra, recurre a `tests/stubs-wp.php`, un fichero
# que NO está en el repositorio. En un equipo con los repos clonados al lado el fallback no se usa
# nunca, así que el fallo solo se veía en el runner:
#   PHP Warning: require_once(.../tests/stubs-wp.php): Failed to open stream
#   Error in bootstrap script: Failed opening required '.../tests/stubs-wp.php'
# Por eso el núcleo se clona al lado, igual que ya hace convoca-ext-gateway en su CI.
name: Cobertura

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cobertura-ref
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cobertura:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: convoca-members
    steps:
      - name: Clonar el plugin
        uses: actions/checkout@v4
        with:
          path: convoca-members

      - name: Clonar el núcleo (lo carga el bootstrap de las pruebas)
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-core
          path: convoca-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-iconv

      - name: Instalar gettext (msgfmt, lo exige el contrato de traducciones)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Tests con cobertura
        # phpunit-unit.xml no declara el filtro: se usa phpunit.xml.dist (misma suite unit, con el
        # filtro sobre ./includes). `defaultTestSuite` deja la integración fuera a propósito.
        run: |
          mkdir -p build
          vendor/bin/phpunit -c phpunit.xml.dist --testsuite unit \
            --coverage-clover build/coverage.xml --coverage-text

      - name: Leer la cobertura y aplicar el suelo
        run: |
          set -euo pipefail
          pct=$(php -r '$x=@simplexml_load_file("build/coverage.xml"); if(!$x){echo "0"; exit;} $m=$x->project->metrics; $t=(int)$m["statements"]; $c=(int)$m["coveredstatements"]; printf("%.1f", $t>0 ? $c*100/$t : 0);')
          echo "Cobertura de líneas: ${pct}%" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -f .coverage-floor ]]; then
            suelo=$(tr -d '[:space:]%' < .coverage-floor)
            echo "Suelo exigido: ${suelo}%" | tee -a "$GITHUB_STEP_SUMMARY"
            if php -r "exit((${pct} < ${suelo}) ? 1 : 0);"; then
              echo "OK: por encima del suelo"
            else
              echo "FALLO: la cobertura (${pct}%) está por debajo del suelo (${suelo}%)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "Modo bootstrap: no hay .coverage-floor, sólo informo" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
