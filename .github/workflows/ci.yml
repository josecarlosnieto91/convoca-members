name: CI

on:
  # Permite relanzarlo a mano cuando cambia una dependencia (por ejemplo el nucleo),
  # sin tener que tocar ningun fichero solo para provocar una ejecucion.
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      # deuda preexistente: 22 errores y 351 warnings (WordPress Coding Standards)
      - name: PHPCS
        # Sin `|| true`: con él phpcs nunca podía fallar el job (el check era decorativo).
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=4G

  test:
    name: PHPUnit ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      # Las clases Convoca\Core (Email_Layout, Mailer) viven en el repositorio del nucleo,
      # que en CI no esta al lado. Se trae para probar contra la clase REAL, no contra un
      # doble que reproduzca su comportamiento y deje la suite corriendo en falso.
      - name: Traer el nucleo (dependencia real)
        run: git clone --depth 1 https://github.com/josecarlosnieto91/convoca-core.git ../convoca-core

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration

  # Este trabajo descarga `plugin-check` de wordpress.org EN CADA EJECUCIÓN (lo hace la acción oficial, no
  # este repositorio). Cuando wp.org tiene un hipo, el trabajo se pone rojo con el mismo código que el commit
  # anterior en verde — y el veredicto del CI deja de hablar del repositorio. El nombre lo dice para que nadie
  # tenga que abrir el log: issue #11, con las dos salidas posibles (versión fijada y cacheada, o declararlo
  # informativo). NO se pone `continue-on-error` para que quede verde: un verde que no valida nada es peor que
  # un rojo que dice la verdad.
  plugin-check:
    name: Plugin Check (PCP · version fijada y cacheada)
    runs-on: ubuntu-latest
    env:
      # Versiones FIJADAS a proposito (issue convoca-members#11). Al subirlas hay que volver a medir.
      WP_VERSION: '7.1.3'
      PLUGIN_CHECK_VERSION: '2.1.0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: '--ignore-platform-req=ext-iconv'
      - name: Build clean plugin dir (as published)
        # Replica el paquete de distribución: excluye tooling dev (.distignore)
        # y archivos ocultos/prohibidos (.htaccess). vendor viaja (wp.org no
        # ejecuta composer y PCP activa el plugin en wp-env).
        run: |
          mkdir -p build-dir
          rsync -a --exclude-from=.distignore ./ build-dir/convoca-members/
          cp -r vendor build-dir/convoca-members/
          find build-dir/convoca-members -name '.htaccess' -delete
          # Quitar 'Requires Plugins' SOLO en el build-dir: la action de PCP
          # ejecuta 'wp plugin install <dep>' contra wp.org, y convoca-core aún
          # no está publicado. El header real del repo se mantiene (wp.org lo
          # auditará cuando core esté publicado también).
          sed -i '/Requires Plugins:/d' build-dir/convoca-members/convoca-members.php
          ls build-dir/convoca-members/
      - name: Traer las piezas fijadas (WordPress y Plugin Check), con cache
        # Antes esto lo hacia la accion oficial, que descargaba `plugin-check` de wordpress.org EN CADA
        # EJECUCION y con la version que hubiera ese dia (issue convoca-members#11): cuando wp.org tenia un
        # hipo el trabajo salia en ROJO por red, y cuando publicaba version nueva los hallazgos cambiaban
        # solos. Ahora las dos piezas van fijadas y cacheadas, y un fallo de red se lee como fallo de red.
        id: piezas
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcp
          key: pcp-wp${{ env.WP_VERSION }}-plugincheck${{ env.PLUGIN_CHECK_VERSION }}

      - name: Descargar las piezas (solo si no estan en cache)
        if: steps.piezas.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pcp"
          traer() {
            if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o "$2" "$1"; then
              echo "::error title=Infraestructura, no el repositorio::No se pudo traer $1. Este rojo NO dice nada del codigo."
              exit 1
            fi
          }
          traer "https://wordpress.org/wordpress-${WP_VERSION}.zip" "$RUNNER_TEMP/pcp/wordpress.zip"
          traer "https://downloads.wordpress.org/plugin/plugin-check.${PLUGIN_CHECK_VERSION}.zip" "$RUNNER_TEMP/pcp/plugin-check.zip"

      - name: Preparar el WordPress de pruebas
        run: |
          unzip -q "$RUNNER_TEMP/pcp/wordpress.zip" -d "$RUNNER_TEMP/pcp"
          cp -r build-dir/convoca-members "$RUNNER_TEMP/pcp/wordpress/wp-content/plugins/convoca-members"
          wp config create --path="$RUNNER_TEMP/pcp/wordpress" --dbname=wordpress \
            --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path="$RUNNER_TEMP/pcp/wordpress" --url=http://localhost:8880 \
            --title=Convoca --admin_user=admin --admin_password=NoEsUnSecreto123 \
            --admin_email=ci@example.org --skip-email

      - name: Run Plugin Check (WordPress.org, version fijada)
        # Categorias plugin_repo + security, bloqueantes. Los avisos no fallan; cualquier ERROR si (exit != 0).
        # El plugin se activa igual que hacia la accion: PCP mide tambien lo que pasa al cargarlo.
        run: |
          wp plugin install "$RUNNER_TEMP/pcp/plugin-check.zip" --activate --path="$RUNNER_TEMP/pcp/wordpress"
          wp plugin activate convoca-members --path="$RUNNER_TEMP/pcp/wordpress"
          wp plugin check convoca-members \
            --path="$RUNNER_TEMP/pcp/wordpress" \
            --categories=plugin_repo,security \
            --ignore-warnings=true

  phpunit-summary:
    name: PHPUnit Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: echo "All PHPUnit runs completed."
